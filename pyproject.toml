[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sipl-toolkit"
version = "0.1.0"
description = "Parser, interpreter and formal tools for the SIPL language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
sipl = "sipl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sipl"]

[tool.hatch.build.targets.wheel.force-include]
"grammar/sipl.lark" = "sipl/grammar/sipl.lark"

[tool.hatch.build.targets.sdist]
include = [
    "/grammar",
    "/src",
    "/examples",
    "/tests",
    "/README.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sipl"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sipl"]

